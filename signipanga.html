  <style>
    :root {
      --fg: #232427;
      --btn: #fff;
      --btn-text: #20242a;
      --btn-hover: #f0f3f7;
      --accent: #555b66;
      --font: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color-scheme: light;
    }

    html { background: #f4f4f4; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      box-sizing: border-box;
      background: #f4f4f4 fixed;
      color: var(--fg);
      font-family: var(--font);
      padding: 40px max(16px, env(safe-area-inset-right, 0px)) 56px max(16px, env(safe-area-inset-left, 0px));
      -webkit-font-smoothing: antialiased;
    }

    #binary {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    main {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      min-width: 0;
    }

    .link-section + .link-section {
      margin-top: 52px;
    }

    .section-title {
      margin: 0 0 18px;
      color: var(--fg);
      font-size: 21px;
      font-weight: 600;
      line-height: 1.35;
      text-align: center;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .links a {
      display: block;
      box-sizing: border-box;
      padding: 18px 20px;
      background: var(--btn);
      color: var(--btn-text);
      border: 1px solid #d9dee7;
      border-radius: 16px;
      box-shadow: 0 5px 16px rgba(31, 41, 55, .09), 0 1px 2px rgba(31, 41, 55, .05);
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.35;
      overflow-wrap: anywhere;
      transition: transform .16s ease, background-color .16s ease, border-color .16s ease, box-shadow .16s ease;
    }

    .links a:hover {
      background: var(--btn-hover);
      border-color: #c6ced9;
      box-shadow: 0 9px 22px rgba(31, 41, 55, .13), 0 2px 5px rgba(31, 41, 55, .06);
      transform: translateY(-3px);
    }

    .links a:active {
      background: #e9edf2;
      box-shadow: 0 2px 6px rgba(31, 41, 55, .08);
      transform: translateY(0);
    }

    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      .links a:hover { transform: none; }
    }
  </style>
</head>
<body>
  <canvas id="binary" aria-hidden="true"></canvas>
  <main>

  <script>
(function () {
  'use strict';

  var canvas = document.getElementById('binary');
  if (!canvas || !canvas.getContext) return;

  var ctx = canvas.getContext('2d');
  var width = 0;
  var height = 0;
  var dpr = 1;
  var columns = 0;
  var rows = 0;
  var digits = [];
  var cellWidth = 22;
  var cellHeight = 27;
  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function random(min, max) {
    return min + Math.random() * (max - min);
  }

  function createDigit(column, row, now) {
    var warm = Math.random() < 0.045;
    return {
      x: column * cellWidth + cellWidth / 2 + random(-1.5, 1.5),
      y: row * cellHeight + cellHeight / 2 + random(-1.5, 1.5),
      value: Math.random() < 0.5 ? '0' : '1',
      color: warm ? '#e6a98d' : '#aeb5bb',
      strength: warm ? random(0.28, 0.48) : random(0.26, 0.43),
      fadeIn: random(110, 300),
      hold: random(140, 420),
      fadeOut: random(130, 340),
      pause: random(70, 320),
      offset: random(0, 1800),
      born: now
    };
  }

  function rebuild(now) {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    columns = Math.ceil(width / cellWidth) + 1;
    rows = Math.ceil(height / cellHeight) + 1;
    digits = [];
    for (var row = 0; row < rows; row++) {
      for (var column = 0; column < columns; column++) {
        digits.push(createDigit(column, row, now));
      }
    }
  }

  function getOpacity(digit, now) {
    if (reducedMotion) return digit.strength * 0.72;

    var cycle = digit.fadeIn + digit.hold + digit.fadeOut + digit.pause;
    var elapsed = (now - digit.born + digit.offset) % cycle;
    if (elapsed < digit.fadeIn) {
      return digit.strength * (elapsed / digit.fadeIn);
    }
    elapsed -= digit.fadeIn;
    if (elapsed < digit.hold) return digit.strength;
    elapsed -= digit.hold;
    if (elapsed < digit.fadeOut) {
      return digit.strength * (1 - elapsed / digit.fadeOut);
    }
    return 0;
  }

  function draw(now) {
    ctx.clearRect(0, 0, width, height);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';

    for (var i = 0; i < digits.length; i++) {
      var digit = digits[i];
      var opacity = getOpacity(digit, now);
      if (opacity <= 0.005) continue;

      ctx.globalAlpha = opacity;
      ctx.fillStyle = digit.color;
      ctx.fillText(digit.value, digit.x, digit.y);
    }

    ctx.globalAlpha = 1;
    if (!reducedMotion) window.requestAnimationFrame(draw);
  }

  var initialTime = performance.now();
  rebuild(initialTime);
  window.addEventListener('resize', function () {
    rebuild(performance.now());
  }, { passive: true });
  draw(initialTime);
})();
</script>
</body>
</html>
