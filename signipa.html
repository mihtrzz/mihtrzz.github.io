  <style>
  :root {
    --bg: #232427;
    --bg-edge: #1b2540;
    --fg: #ffffff;
    --muted: #a9acb5;
    --btn: #ffffff;
    --btn-text: #232427;
    --btn-hover: #ffe8df;
    --accent: #ff6540;
    --font: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  html { background: #0d1219; }
  body {
    margin: 0;
    background: linear-gradient(180deg, #0d1219 0%, #1b2431 55%, #4a4f57 100%) fixed;
    color: var(--fg);
    font-family: var(--font);
    padding-block: 40px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-font-smoothing: antialiased;
  }
  #snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  main {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 28px;
    min-width: 0;
  }
  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: var(--bg-edge);
    border: 0;
    object-fit: cover;
    display: block;
  }
  h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    text-wrap: balance;
    text-align: center;
  }
  .socials {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px 14px;
  }
  .socials a {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    color: var(--fg);
    border-radius: 50%;
    transition: transform 0.15s ease, background-color 0.15s ease;
  }
  .socials a:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-2px); }
  .socials svg { width: 28px; height: 28px; fill: currentColor; }
  .socials svg.stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .links {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .links a {
    display: block;
    box-sizing: border-box;
    padding: 18px 20px;
    background: var(--btn);
    color: var(--btn-text);
    border-radius: 14px;
    text-align: center;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    line-height: 1.3;
    overflow-wrap: anywhere;
    transition: transform 0.15s ease, background-color 0.15s ease;
  }
  .links a:hover { background: var(--btn-hover); transform: translateY(-2px); }
  .links a:active { transform: translateY(0); }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .socials a:hover, .links a:hover { transform: none; }
  }
</style>
</head>

<script>
(function(){
  var c=document.getElementById('snow'),x=c.getContext('2d'),W,H,dpr,flakes=[];
  var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.round(Math.min(160,W*H/9000));
    while(flakes.length<n)flakes.push(make(true));flakes.length=n}
  function make(r){var z=Math.random();return{x:Math.random()*W,y:r?Math.random()*H:-10,r:2.5+z*5,v:.3+z*1.2,d:Math.random()*Math.PI*2,s:.3+Math.random()*.6,a:.35+z*.55}}
  function draw(){
    x.clearRect(0,0,W,H);x.strokeStyle='#fff';x.lineCap='round';x.lineWidth=1;
    for(var i=0;i<flakes.length;i++){var f=flakes[i];
      if(!still){f.d+=.01*f.s;f.y+=f.v;f.x+=Math.sin(f.d)*.5;
        if(f.y>H+10||f.x<-10||f.x>W+10){flakes[i]=make(false);flakes[i].x=Math.random()*W}}
      x.globalAlpha=f.a;var R=f.r;x.save();x.translate(f.x,f.y);x.rotate(f.d);x.beginPath();for(var k=0;k<3;k++){x.moveTo(-R,0);x.lineTo(R,0);if(R>3.5){for(var s=-1;s<=1;s+=2){x.moveTo(s*R*.55,0);x.lineTo(s*R*.8,-R*.25);x.moveTo(s*R*.55,0);x.lineTo(s*R*.8,R*.25)}}x.rotate(Math.PI/3)}x.stroke();x.restore()}
    x.globalAlpha=1;if(!still)requestAnimationFrame(draw)}
  addEventListener('resize',function(){size();if(still)draw()});
  size();draw();
})();
</script>
