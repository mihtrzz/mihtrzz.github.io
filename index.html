<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f4">

  <meta name="referrer" content="no-referrer">
  <base target="_blank">

  <title>Minh Tran</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light;
      --bg: #f4f4f4;
      --text: #232427;
      --card: #fff;
      --card-text: #20242a;
      --card-border: #d9dee7;
      --card-hover: #f0f3f7;
      --card-hover-border: #c6ced9;
      --card-active: #e9edf2;
      --focus: #555b66;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      padding: 40px max(16px, env(safe-area-inset-right)) 56px max(16px, env(safe-area-inset-left));
      color: var(--text);
      font-family: Poppins, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    main {
      display: flex;
      flex-direction: column;
      gap: 28px;
      max-width: 480px;
      margin: 0 auto;
    }

    header,
    section {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      align-items: center;
    }

    img {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      text-wrap: balance;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 14px;
    }

    nav a {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      color: inherit;
      transition: transform .15s, background-color .15s;
    }

    nav a:hover {
      background: rgba(35, 36, 39, .06);
      transform: translateY(-2px);
    }

    nav svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    nav .stroke {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.35;
      text-align: center;
    }

    section a {
      padding: 18px 20px;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      background: var(--card);
      color: var(--card-text);
      box-shadow: 0 5px 16px rgba(31, 41, 55, .09), 0 1px 2px rgba(31, 41, 55, .05);
      font-size: 16px;
      font-weight: 600;
      line-height: 1.35;
      text-align: center;
      text-decoration: none;
      overflow-wrap: anywhere;
      transition: transform .16s, background-color .16s, border-color .16s, box-shadow .16s;
    }

    section a:hover {
      border-color: var(--card-hover-border);
      background: var(--card-hover);
      box-shadow: 0 9px 22px rgba(31, 41, 55, .13), 0 2px 5px rgba(31, 41, 55, .06);
      transform: translateY(-3px);
    }

    section a:active {
      background: var(--card-active);
      box-shadow: 0 2px 6px rgba(31, 41, 55, .08);
      transform: none;
    }

    a:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      nav a:hover,
      section a:hover { transform: none; }
    }
  </style>
</head>

  <script>
    const CELL_W = 22;
    const CELL_H = 27;
    const COLOR = '#aeb5bb';
    const WARM_COLOR = '#e6a98d';
    const WARM_CHANCE = .045;
    const FONT = '13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';

    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let width, height, digits;

    const random = (min, max) => min + Math.random() * (max - min);

    function rebuild() {
      const dpr = Math.min(devicePixelRatio, 2);
      width = innerWidth;
      height = innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = FONT;

      const cols = Math.ceil(width / CELL_W) + 1;
      const rows = Math.ceil(height / CELL_H) + 1;

      digits = Array.from({ length: cols * rows }, (_, i) => {
        const warm = Math.random() < WARM_CHANCE;
        const fadeIn = random(110, 300);
        const fadeOut = random(130, 340);
        const active = fadeIn + random(140, 420) + fadeOut;

        return {
          x: (i % cols + .5) * CELL_W + random(-1.5, 1.5),
          y: (Math.floor(i / cols) + .5) * CELL_H + random(-1.5, 1.5),
          value: Math.random() < .5 ? '0' : '1',
          color: warm ? WARM_COLOR : COLOR,
          strength: warm ? random(.28, .48) : random(.26, .43),
          fadeIn,
          fadeOut,
          active,
          cycle: active + random(70, 320),
          offset: random(0, 1800)
        };
      });
    }

    function draw(now) {
      ctx.clearRect(0, 0, width, height);

      for (const d of digits) {
        const t = (now + d.offset) % d.cycle;
        const fade = Math.max(0, Math.min(t / d.fadeIn, 1, (d.active - t) / d.fadeOut));
        const alpha = d.strength * (reduced ? .72 : fade);
        if (alpha <= .005) continue;

        ctx.globalAlpha = alpha;
        ctx.fillStyle = d.color;
        ctx.fillText(d.value, d.x, d.y);
      }

      if (!reduced) requestAnimationFrame(draw);
    }

    rebuild();
    draw(0);

    addEventListener('resize', () => {
      rebuild();
      if (reduced) draw(0);
    });
  </script>
