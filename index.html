<title>Minh Tran</title>
<style>
:root{--sky-top:#0d1219;--sky-mid:#1b2431;--sky-low:#4a4f57;--glow:#e8dcc0;--text:#f1ede4;--muted:#a9adb3;--line:rgba(241,237,228,.18);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 55%,var(--sky-low) 100%) fixed;color:var(--text);font-family:"Times New Roman",Times,"Liberation Serif",serif;font-weight:700;display:flex;justify-content:center}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
main{position:relative;z-index:2;width:100%;max-width:420px;padding:64px 24px 48px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.avatar{width:168px;height:168px;border-radius:50%;object-fit:cover;border:0;animation:rise 1.4s ease-out both}
h1{margin:32px 0 0;font-weight:700;font-size:clamp(2.6rem,12vw,3.6rem);letter-spacing:.01em;line-height:1.05}
.links{list-style:none;margin:72px 0 0;padding:0;width:100%;border-top:1px solid var(--line)}
.links li{border-bottom:1px solid var(--line)}
.links a{position:relative;display:flex;align-items:center;justify-content:center;gap:16px;padding:18px 4px;color:var(--text);text-decoration:none;font-weight:700;font-size:1.2rem;transition:color .25s}
.links a:hover,.links a:focus-visible{color:var(--glow)}
.links a:focus-visible{outline:2px solid var(--glow);outline-offset:-2px}
.links svg{position:absolute;left:4px;width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.avatar{animation:none}.links a{transition:none}}
</style>

<script>
(function(){
  var c=document.getElementById('snow'),x=c.getContext('2d'),W,H,dpr,flakes=[];
  var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.round(Math.min(160,W*H/9000));
    while(flakes.length<n)flakes.push(make(true));flakes.length=n}
  function make(r){var z=Math.random();return{x:Math.random()*W,y:r?Math.random()*H:-10,r:2.5+z*5,v:.3+z*1.2,d:Math.random()*Math.PI*2,s:.3+Math.random()*.6,a:.35+z*.55}}
  function draw(){
    x.clearRect(0,0,W,H);x.strokeStyle='#fff';x.lineCap='round';x.lineWidth=1;
    for(var i=0;i<flakes.length;i++){var f=flakes[i];
      if(!still){f.d+=.01*f.s;f.y+=f.v;f.x+=Math.sin(f.d)*.5;
        if(f.y>H+10||f.x<-10||f.x>W+10){flakes[i]=make(false);flakes[i].x=Math.random()*W}}
      x.globalAlpha=f.a;var R=f.r;x.save();x.translate(f.x,f.y);x.rotate(f.d);x.beginPath();for(var k=0;k<3;k++){x.moveTo(-R,0);x.lineTo(R,0);if(R>3.5){for(var s=-1;s<=1;s+=2){x.moveTo(s*R*.55,0);x.lineTo(s*R*.8,-R*.25);x.moveTo(s*R*.55,0);x.lineTo(s*R*.8,R*.25)}}x.rotate(Math.PI/3)}x.stroke();x.restore()}
    x.globalAlpha=1;if(!still)requestAnimationFrame(draw)}
  addEventListener('resize',function(){size();if(still)draw()});
  size();draw();
})();
</script>
